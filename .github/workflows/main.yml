name: Auto Update Portal

on:
  schedule:
    # 毎日 日本時間の朝7時（UTCの夜22時）に自動実行
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub画面から手動実行できるボタン

permissions:
  contents: write # サイトを公開するための権限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: プログラムをダウンロード
        uses: actions/checkout@v4

      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: データの集計とページの自動更新
        run: python update_page.py

      - name: Webサイトとして公開（デプロイ）
        run: mkdocs gh-deploy --force