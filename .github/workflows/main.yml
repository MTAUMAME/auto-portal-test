name: Auto Update Portal

on:
  schedule:
    # 1.【変更】渋滞を回避するため、朝7時17分（UTC 22:17）にズラしています
    - cron: '17 22 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

# 2.【追加】Node.js 20の警告エラーを完全に消し去る設定
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: プログラムをダウンロード
        uses: actions/checkout@v4

      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: データの集計とページの自動更新
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_page.py

      - name: Webサイトとして公開（デプロイ）
        run: mkdocs gh-deploy --force

      # 3.【追加・超重要】作られた記事を消さずにアーカイブとして蓄積するセーブ機能
      - name: 自動生成されたデータをGitHubに保存する
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "毎日の自動生成データを保存" || echo "No changes to commit"
          git push origin main