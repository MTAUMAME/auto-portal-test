name: Auto Update Portal

on:
  schedule:
    - cron: '0 22 * * *' # 毎日朝7時の定期実行
  push:                  # ★【新規追加】PCからデータが送られてきたら
    branches:
      - main             # mainブランチへの送信を合図にする
  workflow_dispatch:     # 手動ボタン（残しておきます）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: プログラムをダウンロード
        uses: actions/checkout@v4

      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ライブラリのインストール
        run: pip install -r requirements.txt

      - name: データの集計とページの自動更新
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python update_page.py

      - name: Webサイトとして公開（デプロイ）
        run: mkdocs gh-deploy --force